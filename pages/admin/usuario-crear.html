<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear usuario — Panel administrativo GRIP</title>
  <meta name="description" content="Crear un nuevo usuario en GRIP Sneaker Store.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body class="admin-body" data-pagina-permitida="administrador">

  <header class="admin-topbar">
    <div class="admin-topbar-inner">
      <a href="../../index.html" class="logo">GRIP<span class="logo-accent">.</span></a>
      <p class="admin-badge">Panel administrativo</p>
      <div class="admin-topbar-actions">
        <span id="admin-usuario-activo" class="admin-usuario-activo"></span>
        <a href="../../index.html" class="boton boton-secundario boton-pequeno">Volver a la tienda</a>
      </div>
    </div>
  </header>

  <div class="admin-layout">

    <nav class="admin-sidebar" aria-label="Navegación administrativa">
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li>
          <span class="admin-sidebar-grupo">Productos</span>
          <ul>
            <li data-rol-permitido="administrador,vendedor"><a href="productos.html">Ver productos</a></li>
            <li data-rol-permitido="administrador"><a href="producto-crear.html">Crear producto</a></li>
          </ul>
        </li>
        <li data-rol-permitido="administrador">
          <span class="admin-sidebar-grupo">Usuarios</span>
          <ul>
            <li data-rol-permitido="administrador"><a href="usuarios.html">Ver usuarios</a></li>
            <li data-rol-permitido="administrador"><a href="usuario-crear.html" aria-current="page">Crear usuario</a></li>
          </ul>
        </li>
      </ul>
    </nav>

    <main class="admin-main">
      <h1>Crear usuario</h1>

      <form id="form-usuario" class="form-admin" novalidate>

        <div class="form-grid">

          <div class="campo">
            <label for="usuario-run">RUN</label>
            <input
              type="text"
              id="usuario-run"
              name="run"
              placeholder="Sin puntos ni guion"
              minlength="7"
              maxlength="9"
              autocomplete="off"
              required>
            <p class="mensaje-error" id="error-usuario-run" role="alert"></p>
          </div>

          <div class="campo">
            <label for="usuario-nombre">Nombre</label>
            <input
              type="text"
              id="usuario-nombre"
              name="nombre"
              maxlength="50"
              autocomplete="off"
              required>
            <p class="mensaje-error" id="error-usuario-nombre" role="alert"></p>
          </div>

          <div class="campo">
            <label for="usuario-apellidos">Apellidos</label>
            <input
              type="text"
              id="usuario-apellidos"
              name="apellidos"
              maxlength="100"
              autocomplete="off"
              required>
            <p class="mensaje-error" id="error-usuario-apellidos" role="alert"></p>
          </div>

          <div class="campo">
            <label for="usuario-correo">Correo electrónico</label>
            <input
              type="email"
              id="usuario-correo"
              name="correo"
              maxlength="100"
              autocomplete="off"
              required>
            <p class="mensaje-error" id="error-usuario-correo" role="alert"></p>
          </div>

          <div class="campo">
            <label for="usuario-fecha-nacimiento">Fecha de nacimiento</label>
            <input
              type="date"
              id="usuario-fecha-nacimiento"
              name="fechaNacimiento"
              autocomplete="off"
              required>
            <p class="mensaje-error" id="error-usuario-fecha-nacimiento" role="alert"></p>
          </div>

          <div class="campo">
            <label for="usuario-tipo">Tipo de usuario</label>
            <select id="usuario-tipo" name="tipoUsuario" autocomplete="off" required>
              <option value="" selected disabled>Selecciona un rol</option>
              <option value="administrador">Administrador</option>
              <option value="vendedor">Vendedor</option>
              <option value="cliente">Cliente</option>
            </select>
            <p class="mensaje-error" id="error-usuario-tipo" role="alert"></p>
          </div>

          <div class="campo">
            <label for="usuario-region">Región</label>
            <select id="usuario-region" name="region" autocomplete="off" required>
              <option value="" selected disabled>Selecciona una región</option>
              <!-- Etapa 4: opciones quemadas a mano, iguales a las de registro.html -->
              <option value="arica-parinacota">Arica y Parinacota</option>
              <option value="tarapaca">Tarapacá</option>
              <option value="antofagasta">Antofagasta</option>
              <option value="atacama">Atacama</option>
              <option value="coquimbo">Coquimbo</option>
              <option value="valparaiso">Valparaíso</option>
              <option value="metropolitana">Metropolitana de Santiago</option>
              <option value="ohiggins">Libertador General Bernardo O'Higgins</option>
              <option value="maule">Maule</option>
              <option value="nuble">Ñuble</option>
              <option value="biobio">Biobío</option>
              <option value="araucania">La Araucanía</option>
              <option value="los-rios">Los Ríos</option>
              <option value="los-lagos">Los Lagos</option>
              <option value="aysen">Aysén del General Carlos Ibáñez del Campo</option>
              <option value="magallanes">Magallanes y de la Antártica Chilena</option>
            </select>
            <p class="mensaje-error" id="error-usuario-region" role="alert"></p>
          </div>

          <div class="campo">
            <label for="usuario-comuna">Comuna</label>
            <select id="usuario-comuna" name="comuna" autocomplete="off" required disabled>
              <option value="" selected disabled>Primero selecciona una región</option>
            </select>
            <p class="mensaje-error" id="error-usuario-comuna" role="alert"></p>
          </div>

          <div class="campo campo-ancho">
            <label for="usuario-direccion">Dirección</label>
            <input
              type="text"
              id="usuario-direccion"
              name="direccion"
              maxlength="300"
              autocomplete="off"
              required>
            <p class="mensaje-error" id="error-usuario-direccion" role="alert"></p>
          </div>

        </div>

        <p class="mensaje-exito" id="exito-usuario" role="status"></p>

        <div class="form-admin-acciones">
          <button type="submit" class="boton boton-primario">Crear usuario</button>
          <a href="usuarios.html" class="boton boton-secundario">Cancelar</a>
        </div>
      </form>
    </main>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="../../js/main.js"></script>
  <script src="../../data/usuarios.js"></script>
  <script src="../../js/roles.js"></script>
  <script src="../../js/validaciones.js"></script>
  <script src="../../data/regiones.js"></script>
  <script src="../../js/regiones-comunas.js"></script>
  <script src="../../js/admin-usuarios.js"></script>
</body>
</html>
