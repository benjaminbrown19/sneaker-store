<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear producto — Panel administrativo GRIP</title>
  <meta name="description" content="Crear un nuevo producto en GRIP Sneaker Store.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body class="admin-body" data-pagina-permitida="administrador">

  <header class="admin-topbar">
    <div class="admin-topbar-inner">
      <a href="../../index.html" class="logo">GRIP<span class="logo-accent">.</span></a>
      <p class="admin-badge">Panel administrativo</p>
      <div class="admin-topbar-actions">
        <span id="admin-usuario-activo" class="admin-usuario-activo"></span>
        <a href="../../index.html" class="boton boton-secundario boton-pequeno">Volver a la tienda</a>
      </div>
    </div>
  </header>

  <div class="admin-layout">

    <nav class="admin-sidebar" aria-label="Navegación administrativa">
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li>
          <span class="admin-sidebar-grupo">Productos</span>
          <ul>
            <li data-rol-permitido="administrador,vendedor"><a href="productos.html">Ver productos</a></li>
            <li data-rol-permitido="administrador"><a href="producto-crear.html" aria-current="page">Crear producto</a></li>
          </ul>
        </li>
        <li data-rol-permitido="administrador">
          <span class="admin-sidebar-grupo">Usuarios</span>
          <ul>
            <li data-rol-permitido="administrador"><a href="usuarios.html">Ver usuarios</a></li>
            <li data-rol-permitido="administrador"><a href="usuario-crear.html">Crear usuario</a></li>
          </ul>
        </li>
      </ul>
    </nav>

    <main class="admin-main">
      <h1>Crear producto</h1>

      <form id="form-producto" class="form-admin" novalidate>

        <div class="form-grid">

          <div class="campo">
            <label for="producto-codigo">Código</label>
            <input
              type="text"
              id="producto-codigo"
              name="codigo"
              placeholder="Ej: SNK-001"
              minlength="3"
              autocomplete="off"
              required>
            <p class="mensaje-error" id="error-producto-codigo" role="alert"></p>
          </div>

          <div class="campo">
            <label for="producto-nombre">Nombre</label>
            <input
              type="text"
              id="producto-nombre"
              name="nombre"
              placeholder="Ej: GRIP Runner X1"
              maxlength="100"
              autocomplete="off"
              required>
            <p class="mensaje-error" id="error-producto-nombre" role="alert"></p>
          </div>

          <div class="campo campo-ancho">
            <label for="producto-descripcion">Descripción</label>
            <textarea
              id="producto-descripcion"
              name="descripcion"
              placeholder="Descripción del producto (opcional)"
              maxlength="500"
              rows="4"></textarea>
            <p class="mensaje-error" id="error-producto-descripcion" role="alert"></p>
          </div>

          <div class="campo">
            <label for="producto-precio">Precio (CLP)</label>
            <input
              type="number"
              id="producto-precio"
              name="precio"
              placeholder="Ej: 59990"
              min="0"
              step="0.01"
              inputmode="decimal"
              autocomplete="off"
              required>
            <p class="mensaje-error" id="error-producto-precio" role="alert"></p>
          </div>

          <div class="campo">
            <label for="producto-stock">Stock</label>
            <input
              type="number"
              id="producto-stock"
              name="stock"
              placeholder="Ej: 20"
              min="0"
              step="1"
              inputmode="numeric"
              autocomplete="off"
              required>
            <p class="mensaje-error" id="error-producto-stock" role="alert"></p>
          </div>

          <div class="campo">
            <label for="producto-stock-critico">Stock crítico</label>
            <input
              type="number"
              id="producto-stock-critico"
              name="stockCritico"
              placeholder="Ej: 5 (opcional)"
              min="0"
              step="1"
              inputmode="numeric"
              autocomplete="off">
            <p class="mensaje-error" id="error-producto-stock-critico" role="alert"></p>
          </div>

          <div class="campo">
            <label for="producto-categoria">Categoría</label>
            <select id="producto-categoria" name="categoria" autocomplete="off" required>
              <option value="" selected disabled>Selecciona una categoría</option>
              <option value="urbano">Urbano</option>
              <option value="running">Running</option>
              <option value="basketball">Basketball</option>
              <option value="skate">Skate</option>
            </select>
            <p class="mensaje-error" id="error-producto-categoria" role="alert"></p>
          </div>

          <div class="campo">
            <label for="producto-imagen">Imagen del producto</label>
            <input
              type="file"
              id="producto-imagen"
              name="imagen"
              accept="image/*">
            <p class="mensaje-error" id="error-producto-imagen" role="alert"></p>
          </div>

        </div>

        <p class="mensaje-exito" id="exito-producto" role="status"></p>

        <div class="form-admin-acciones">
          <button type="submit" class="boton boton-primario">Guardar producto</button>
          <a href="productos.html" class="boton boton-secundario">Cancelar</a>
        </div>
      </form>
    </main>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="../../js/main.js"></script>
  <script src="../../data/productos.js"></script>
  <script src="../../js/roles.js"></script>
  <script src="../../js/validaciones.js"></script>
  <script src="../../js/admin-productos.js"></script>
</body>
</html>
