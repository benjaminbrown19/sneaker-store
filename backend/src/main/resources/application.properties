server.port=8080
server.address=127.0.0.1
spring.application.name=grip-backend
spring.datasource.url=jdbc:mysql://localhost:3306/grip_sneaker_store?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${GRIP_DB_USER:grip_app}
spring.datasource.password=${GRIP_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
springdoc.swagger-ui.path=/swagger-ui.html

# Definir estas variables en PowerShell (no subir secretos a Git)
grip.jwt.secret=${GRIP_JWT_SECRET}
grip.jwt.expiration-ms=900000
grip.jwt.refresh-expiration-ms=604800000
