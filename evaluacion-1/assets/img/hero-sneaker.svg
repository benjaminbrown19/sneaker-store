  <text x="50%" y="95%" text-anchor="middle" font-family="Courier New, monospace" font-size="13" letter-spacing="1" fill="#8B8D96">FOTO PROVISIONAL — REEMPLAZAR POR FOTO REAL DEL PRODUCTO</text>
